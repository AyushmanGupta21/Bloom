<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1C1F" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="150" y1="150" x2="362" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B8B8C0" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </radialGradient>
    <filter id="coreBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- Dark rounded tile -->
  <rect width="512" height="512" rx="120" fill="url(#tileGrad)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="118.5" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />

  <!-- 4 bold primary petals (cardinal) -->
  <g fill="url(#petalGrad)">
    <path d="M256 104 C292 168 292 216 256 248 C220 216 220 168 256 104 Z" />
    <path d="M256 408 C220 344 220 296 256 264 C292 296 292 344 256 408 Z" />
    <path d="M104 256 C168 220 216 220 248 256 C216 292 168 292 104 256 Z" />
    <path d="M408 256 C344 292 296 292 264 256 C296 220 344 220 408 256 Z" />
  </g>

  <!-- 4 diagonal petals (thinner, secondary) -->
  <g fill="url(#petalGrad)" opacity="0.6">
    <path d="M363 149 C334 205 301 238 262 250 C286 208 320 176 363 149 Z" />
    <path d="M149 149 C205 178 238 211 250 250 C208 226 176 192 149 149 Z" />
    <path d="M363 363 C307 334 274 301 262 262 C304 286 336 320 363 363 Z" />
    <path d="M149 363 C178 307 211 274 250 262 C226 304 192 336 149 363 Z" />
  </g>

  <!-- Emerald core glow + solid center -->
  <circle cx="256" cy="256" r="40" fill="url(#coreGlow)" filter="url(#coreBlur)" opacity="0.9" />
  <circle cx="256" cy="256" r="26" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="11" fill="#FFFFFF" />
</svg>
